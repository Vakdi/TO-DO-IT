<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачи</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== Цвета и шрифт ===== */
  :root {
    color-scheme: dark;
    --bg-top: #0d0b0e; --bg-mid: #2c2c37; --text: #fff; --muted: #a9acb8; --amber: #ffc542; --cool: #8fb3ff;
    --glass: rgba(120,126,145,.38);
    --font: "Inter", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100vh; font-family: var(--font); font-weight: 700; color: var(--text);
    background: radial-gradient(60% 55% at 72% 38%, rgba(224,34,45,.55), transparent 70%),
                linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 60%, #6c7383 100%);
    background-attachment: fixed;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ===== Верхнее меню: разделы ===== */
  .topbar { display: flex; align-items: center; gap: 40px; height: 120px; padding: 0 48px 0 105px; }
  .filters { display: flex; gap: 36px; }
  .filter { background: none; border: 0; padding: 8px 0; cursor: pointer; font-size: 28px; font-weight: 800; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  .filter:hover { color: #fff; }
  .filter.active { color: #fff; border-bottom-color: #fff; }
  .owner { margin-left: auto; font-size: 28px; font-weight: 800; white-space: nowrap; }

  /* ===== Сетка: слева заголовок и формы, справа список ===== */
  .layout { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); gap: 48px; padding: 40px 48px 48px 105px; align-items: start; }
  h1 { margin: 40px 0 24px; font-weight: 800; font-size: clamp(56px, 9vw, 128px); letter-spacing: -.045em; line-height: .95; }
  .lead { max-width: 28ch; color: var(--muted); font-size: 20px; line-height: 1.55; margin: 0 0 40px; }
  .field { padding: 16px 20px; font-size: 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); border-radius: 0; outline: none; }
  .field::placeholder { color: var(--muted); }
  .field:focus { border-color: #fff; background: rgba(255,255,255,.12); }
  select.field option { color: #111; }
  .add { display: flex; gap: 12px; max-width: 520px; }
  .add .field { flex: 1; min-width: 0; }
  .add button { padding: 0 28px; background: #fff; color: #14121a; border: 0; font-size: 18px; cursor: pointer; }
  .add button:hover { background: #ffd9dc; }
  .hint { max-width: 520px; margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }

  .progress { display: flex; align-items: center; gap: 20px; margin-top: 40px; max-width: 520px; font-size: 26px; }
  .progress .total { color: var(--muted); }
  .bar { flex: 1; height: 3px; background: rgba(255,255,255,.25); }
  .bar i { display: block; height: 100%; width: 0; background: #fff; transition: width .35s ease; }

  /* Статистика */
  .stats { display: flex; align-items: flex-end; gap: 28px; margin-top: 32px; max-width: 520px; }
  .stat b { display: block; font-size: 40px; line-height: 1; }
  .stat span { display: block; margin-top: 6px; color: var(--muted); font-size: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 64px; margin-left: auto; }
  .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; width: 22px; font-size: 11px; color: var(--muted); }
  .col i { display: block; width: 100%; min-height: 3px; background: #fff; }
  .col.zero i { background: rgba(255,255,255,.25); }

  .backup { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
  .btn { padding: 8px 16px; font-size: 16px; cursor: pointer; background: none; border: 1px solid rgba(255,255,255,.5); }
  .btn:hover { border-color: #fff; background: rgba(255,255,255,.14); }
  .btn.primary { background: #fff; color: #14121a; border-color: #fff; }
  .btn.primary:hover { background: #ffd9dc; }

  /* ===== Стеклянная панель ===== */
  .panel { padding: 36px 40px; min-height: 360px; background: linear-gradient(100deg, var(--glass) 0%, rgba(150,40,48,.55) 60%, var(--glass) 100%); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
  .panel-label { margin: 0; color: var(--muted); font-size: 15px; letter-spacing: .18em; }
  .confirm-box { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .tools { display: flex; gap: 10px; }
  .tools .field { padding: 10px 14px; font-size: 16px; }
  .tools #search { flex: 1; min-width: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 8px; }
  .tag { padding: 4px 12px; font-size: 14px; cursor: pointer; background: none; border: 1px solid rgba(255,255,255,.4); border-radius: 99px; }
  .tag:hover { border-color: #fff; }
  .tag.on { background: #fff; color: #14121a; border-color: #fff; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list.locked .grip { visibility: hidden; }

  /* Задача */
  .task { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,.16); }
  .task:last-child { border-bottom: 0; }
  .task.p-high { box-shadow: inset 4px 0 0 var(--amber); padding-left: 12px; }
  .task.p-low { box-shadow: inset 4px 0 0 var(--cool); padding-left: 12px; }
  .sortable-ghost { opacity: .35; }
  .grip { flex: none; width: 18px; margin-top: 5px; color: var(--muted); cursor: grab; touch-action: none; }
  .grip svg { width: 18px; height: 18px; display: block; }
  .check { flex: none; width: 28px; height: 28px; margin-top: 1px; border-radius: 50%; cursor: pointer; background: none; border: 2px solid rgba(255,255,255,.7); display: grid; place-items: center; }
  .check:hover { border-color: #fff; }
  .task.done .check { background: #fff; border-color: #fff; }
  .task.done .check::after { content: ""; width: 6px; height: 12px; margin-top: -2px; border: solid #1a1720; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .task-body { flex: 1 1 150px; min-width: 0; }
  .task-text { display: block; font-size: 22px; overflow-wrap: anywhere; cursor: text; }
  .task.done .task-text { color: var(--muted); text-decoration: line-through; }
  .edit-input { width: 100%; padding: 6px 10px; font-size: 20px; background: rgba(255,255,255,.12); border: 1px solid #fff; border-radius: 0; outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
  .chip { font-size: 13px; color: var(--muted); }
  .chip.hi { color: var(--amber); } .chip.lo { color: var(--cool); }
  .task-actions { display: flex; gap: 0; margin: -5px 0 0 auto; }
  .icon-btn, .del { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 6px 7px; }
  .icon-btn { display: grid; place-items: center; }
  .icon-btn:hover, .icon-btn.on, .del:hover { color: #fff; }
  .icon-btn.hi { color: var(--amber); } .icon-btn.lo { color: var(--cool); }
  .icon-btn svg { width: 22px; height: 22px; }
  .del { font-size: 30px; line-height: 1; padding: 4px 8px; }
  .empty { color: var(--muted); font-size: 20px; padding: 12px 0; }

  /* Срок и шкала отсчёта */
  .due { margin-top: 12px; max-width: 420px; }
  .due-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 15px; color: var(--muted); }
  .due-left { color: #fff; } .due-left.late { color: var(--amber); }
  .scale { height: 4px; margin-top: 8px; background: rgba(255,255,255,.22); }
  .scale i { display: block; height: 100%; width: 0; background: #fff; }
  .scale.warn i { background: var(--amber); }
  .due-editor { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .due-editor input, .due-editor select { padding: 9px 12px; font-size: 15px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.35); border-radius: 0; color-scheme: dark; }
  .due-editor select option { color: #111; }

  /* Пункты и заметка */
  .details { display: grid; gap: 10px; margin-top: 14px; max-width: 460px; }
  .sub { display: flex; align-items: center; gap: 10px; font-size: 17px; }
  .sub-check { flex: none; width: 20px; height: 20px; background: none; border: 2px solid rgba(255,255,255,.7); cursor: pointer; display: grid; place-items: center; }
  .sub.done .sub-check { background: #fff; border-color: #fff; }
  .sub.done .sub-check::after { content: ""; width: 4px; height: 9px; margin-top: -2px; border: solid #1a1720; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .sub.done .sub-text { color: var(--muted); text-decoration: line-through; }
  .sub-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .sub-del { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 22px; line-height: 1; }
  .sub-del:hover { color: #fff; }
  .details .field { padding: 8px 12px; font-size: 15px; width: 100%; resize: vertical; }
  .links { display: grid; gap: 4px; font-size: 14px; }
  .links a { color: #fff; overflow-wrap: anywhere; }

  /* Плашка (отмена удаления, напоминания) */
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 16px; max-width: calc(100% - 32px); padding: 12px 16px; font-size: 16px; background: rgba(20,18,26,.96); border: 1px solid rgba(255,255,255,.35); }

  @media (max-width: 1400px) { .owner { font-size: 22px; } .filter { font-size: 24px; } .filters { gap: 32px; } }
  @media (max-width: 1100px) { .owner { display: none; } }
  @media (max-width: 860px) {
    .topbar { gap: 20px; height: 72px; padding: 0 20px; }
    .filters { gap: 16px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .filter { font-size: 20px; }
    .layout { grid-template-columns: 1fr; padding: 16px 20px 32px; gap: 32px; }
    .panel { padding: 24px 16px; }
    .task-text { font-size: 19px; }
    .task { gap: 10px; }
    .tools { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>

<!-- Верхнее меню: разделы списка -->
<header class="topbar">
  <nav class="filters" id="filters" aria-label="Разделы">
    <button class="filter active" data-filter="all">все</button>
    <button class="filter" data-filter="today">сегодня</button>
    <button class="filter" data-filter="active">активные</button>
    <button class="filter" data-filter="done">выполненные</button>
    <button class="filter" data-filter="overdue">просроченные</button>
  </nav>
  <div class="owner">Личный список дел</div>
</header>

<main class="layout">
  <!-- Левая колонка: заголовок, добавление, прогресс, статистика, копия -->
  <section>
    <h1>Задачи</h1>
    <p class="lead">Запишите, что нужно сделать, и отмечайте сделанное.</p>

    <form class="add" id="addForm">
      <input class="field" id="taskInput" type="text" placeholder="Новая задача" maxlength="120" autocomplete="off" aria-label="Текст новой задачи">
      <button type="submit">Добавить</button>
    </form>
    <p class="hint">Тег добавляется в текст: «Купить хлеб #дом». Клавиши: N — новая задача, / — поиск, Ctrl+Z — вернуть удалённое.</p>

    <div class="progress" aria-live="polite">
      <span id="doneCount">00</span>
      <div class="bar"><i id="barFill"></i></div>
      <span class="total" id="totalCount">00</span>
    </div>

    <!-- Статистика: выполнено за 7 дней, серия дней, столбики по дням -->
    <div class="stats">
      <div class="stat"><b id="stWeek">0</b><span>выполнено за 7 дней</span></div>
      <div class="stat"><b id="stStreak">0</b><span>дней подряд</span></div>
      <div class="bars" id="stBars" aria-hidden="true"></div>
    </div>

  </section>

  <!-- Правая колонка: поиск, порядок, теги, список -->
  <section class="panel">
    <div class="panel-head">
      <p class="panel-label">СПИСОК</p>
      <!-- Убирает задачи текущего раздела; вопрос «Да / Нет» исчезает через 3 секунды -->
      <button class="btn" id="clearAll" type="button">Убрать задачи</button>
      <div class="confirm-box" id="confirmBox" hidden>
        <span>Убрать эти задачи?</span>
        <button class="btn primary" type="button" id="confirmYes">Да</button>
        <button class="btn" type="button" id="confirmNo">Нет</button>
      </div>
    </div>
    <div class="tools">
      <input class="field" id="search" type="search" placeholder="Поиск по задачам и тегам" aria-label="Поиск">
      <select class="field" id="sort" aria-label="Порядок">
        <option value="manual">порядок: мой</option>
        <option value="due">порядок: по сроку</option>
        <option value="prio">порядок: по важности</option>
      </select>
    </div>
    <div class="tags" id="tags"></div>
    <ul class="list" id="list"></ul>
  </section>
</main>

<!-- Плашка с сообщением и кнопкой «Вернуть» -->
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button class="btn" id="toastBtn" type="button" hidden></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
  // ===== Состояние =====
  // задача: {id, text, done, due, dueStart, repeat, prio, note, subs[{id,text,done}], warned, late, spawned}
  // log: журнал выполнений [{id, at}] для статистики
  const KEY = 'todo-state-v2', OLD_KEY = 'todo-tasks-v1', SORT_KEY = 'todo-sort';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  let tasks = [], log = [], stateAt = 0;
  let filter = 'all', query = '', activeTag = null, sort = 'manual';
  let editingId = null, openId = null, lastOverdue = 0, undoFn = null;
  const REPEATS = { '': 'не повторять', daily: 'каждый день', weekly: 'каждую неделю', monthly: 'каждый месяц' };
  const PRIO_NAME = { high: 'важно', low: 'потом' };
  const svg = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
  const CLOCK = svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>');
  const FLAG = svg('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>');
  const LIST = svg('<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>');
  const GRIP = '<svg viewBox="0 0 18 18" fill="currentColor"><circle cx="6" cy="4" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="6" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="6" cy="14" r="1.6"/><circle cx="12" cy="14" r="1.6"/></svg>';

  // ===== Хранение: localStorage + синхронизация =====
  (function loadLocal() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.tasks)) { tasks = s.tasks; log = Array.isArray(s.log) ? s.log : []; stateAt = s.at || 0; }
      else { const old = JSON.parse(localStorage.getItem(OLD_KEY)); if (Array.isArray(old)) tasks = old; }   // перенос из первой версии
      const so = localStorage.getItem(SORT_KEY); if (so) sort = so;
    } catch (e) {}
  })();
  function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify({ tasks: tasks, log: log, at: stateAt })); } catch (e) {} }
  function save() { persistLocal(); }
  // уже просроченные при открытии не вызывают напоминаний
  tasks.forEach(t => { if (t.due && t.due < Date.now()) { t.late = true; t.warned = true; } });

  const busy = () => editingId !== null || $('list').contains(document.activeElement);

  // ===== Вспомогательное =====
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function parse(text) {                                   // «Купить хлеб #дом» -> заголовок + теги
    const tags = (text.match(/#[^\s#]+/g) || []).map(s => s.slice(1).toLowerCase());
    return { title: text.replace(/#[^\s#]+/g, '').replace(/\s+/g, ' ').trim() || text, tags: tags };
  }
  function fmtDate(ms) {
    const o = { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
    if (new Date(ms).getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
    return new Date(ms).toLocaleString('ru-RU', o);
  }
  function fmtLeft(ms) {
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d > 0) return d + ' д ' + h + ' ч';
    if (h > 0) return h + ' ч ' + m + ' мин';
    return m + ' мин ' + pad(s % 60) + ' с';
  }
  const dayKey = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const toLocalInput = ms => dayKey(ms) + 'T' + pad(new Date(ms).getHours()) + ':' + pad(new Date(ms).getMinutes());

  // ===== Разделы, поиск, теги, порядок =====
  const isOverdue = t => !t.done && !!t.due && t.due < Date.now();
  const isToday = t => !t.done && !!t.due && dayKey(t.due) === dayKey(Date.now());
  const inSection = t => filter === 'all' ? true : filter === 'done' ? t.done : filter === 'overdue' ? isOverdue(t)
    : filter === 'today' ? isToday(t) : (!t.done && !isOverdue(t));
  const shown = t => inSection(t)
    && (!query || t.text.toLowerCase().includes(query.replace(/^#/, '')))
    && (!activeTag || parse(t.text).tags.includes(activeTag));
  const BIG = 8.64e15, rank = t => t.prio === 'high' ? 0 : t.prio === 'low' ? 2 : 1;
  function sorted(list) {
    if (sort === 'manual') return list;
    const dn = (a, b) => Number(!!a.done) - Number(!!b.done);
    return list.slice().sort(sort === 'due'
      ? (a, b) => dn(a, b) || (a.due || BIG) - (b.due || BIG)
      : (a, b) => dn(a, b) || rank(a) - rank(b) || (a.due || BIG) - (b.due || BIG));
  }

  // ===== Плашка и звук =====
  let toastTimer;
  const hideToast = () => { $('toast').hidden = true; };
  function toast(msg, label, fn, ms) {
    $('toastText').textContent = msg;
    const b = $('toastBtn'); b.hidden = !label; b.textContent = label || '';
    b.onclick = () => { hideToast(); if (fn) fn(); };
    $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms || 6000);
  }
  function beep() {
    try {
      const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .3);
    } catch (e) {}
  }
  function notify(title, body) {
    toast(title + ': ' + body, null, null, 10000); beep();
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body: body }); } catch (e) {}
  }
  function checkReminders() {                              // за 15 минут до срока и в момент его окончания
    const now = Date.now(); let changed = false;
    tasks.forEach(t => {
      if (!t.due || t.done) return;
      const left = t.due - now, name = parse(t.text).title;
      if (left <= 0 && !t.late) { t.late = t.warned = changed = true; notify('Срок истёк', name); }
      else if (left > 0 && left <= 15 * 60000 && !t.warned) { t.warned = changed = true; notify('Осталось меньше 15 минут', name); }
    });
    if (changed) save();
  }

  // ===== Действия над задачами =====
  function nextDue(t) {                                    // следующий срок повторяющейся задачи
    const d = new Date(t.due);
    do {
      if (t.repeat === 'daily') d.setDate(d.getDate() + 1);
      else if (t.repeat === 'weekly') d.setDate(d.getDate() + 7);
      else d.setMonth(d.getMonth() + 1);
    } while (d.getTime() <= Date.now());
    return d.getTime();
  }
  function toggleTask(id) {
    const t = tasks.find(x => x.id === id); if (!t) return;
    t.done = !t.done;
    if (t.done) log.push({ id: id, at: Date.now() }); else log = log.filter(x => x.id !== id);
    if (t.done && t.repeat && t.due && !t.spawned) {
      t.spawned = true;
      const due = nextDue(t);
      tasks.splice(tasks.indexOf(t) + 1, 0, { id: Date.now() + 1, text: t.text, done: false, due: due, dueStart: Date.now(), repeat: t.repeat, prio: t.prio || null });
      toast('Следующая задача: до ' + fmtDate(due));
    }
    save(); render();
  }
  function removeTasks(list) {                             // удаление с возможностью вернуть
    if (!list.length) return;
    const items = list.map(t => ({ t: t, i: tasks.indexOf(t) })).sort((a, b) => a.i - b.i);
    tasks = tasks.filter(t => !list.includes(t)); save(); render();
    const restore = () => { undoFn = null; items.forEach(x => tasks.splice(Math.min(x.i, tasks.length), 0, x.t)); save(); render(); };
    undoFn = restore; setTimeout(() => { if (undoFn === restore) undoFn = null; }, 6000);
    toast(list.length === 1 ? 'Задача удалена' : 'Удалено задач: ' + list.length, 'Вернуть', restore);
  }

  // ===== Срок: блок со шкалой и редактор =====
  function paintTimer(box, t) {
    const scale = box.querySelector('.scale'); if (!scale) return;
    const now = Date.now(), total = t.due - (t.dueStart || now), left = t.due - now;
    const pct = total > 0 ? Math.min(100, Math.max(0, (now - t.dueStart) / total * 100)) : 100;
    scale.firstChild.style.width = pct + '%'; scale.classList.toggle('warn', pct >= 80);
    const label = box.querySelector('.due-left');
    label.textContent = left > 0 ? 'осталось ' + fmtLeft(left) : 'просрочено на ' + fmtLeft(-left);
    label.classList.toggle('late', left <= 0);
  }
  function buildDue(t) {
    const box = el('div', 'due'), line = el('div', 'due-line');
    line.appendChild(el('span', 'due-date', 'до ' + fmtDate(t.due)));
    if (t.repeat) line.appendChild(el('span', '', 'повтор: ' + REPEATS[t.repeat]));
    box.appendChild(line);
    if (!t.done) {
      line.appendChild(el('span', 'due-left'));
      const scale = el('div', 'scale'); scale.appendChild(document.createElement('i'));
      box.appendChild(scale); paintTimer(box, t);
    }
    return box;
  }
  function buildEditor(t) {
    const box = el('div', 'due-editor'), input = document.createElement('input'), sel = document.createElement('select');
    input.type = 'datetime-local'; input.min = toLocalInput(Date.now()); input.value = toLocalInput(t.due || Date.now() + 3600000);
    input.setAttribute('aria-label', 'Срок выполнения'); sel.setAttribute('aria-label', 'Повтор');
    Object.keys(REPEATS).forEach(k => { const o = el('option', '', REPEATS[k]); o.value = k; sel.appendChild(o); });
    sel.value = t.repeat || '';
    const ok = el('button', 'btn primary', 'Сохранить'), cancelBtn = el('button', 'btn', 'Отмена');
    ok.type = cancelBtn.type = 'button';
    const apply = () => {
      const ms = new Date(input.value).getTime(); if (!input.value || isNaN(ms)) return;
      t.due = ms; t.dueStart = Date.now(); t.repeat = sel.value || null; t.warned = t.late = t.spawned = false;
      try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
      editingId = null; save(); render();
    };
    const cancel = () => { editingId = null; render(); };
    ok.onclick = apply; cancelBtn.onclick = cancel;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); if (e.key === 'Escape') cancel(); });
    box.append(input, sel, ok);
    if (t.due) {
      const rm = el('button', 'btn', 'Убрать срок'); rm.type = 'button';
      rm.onclick = () => { t.due = t.dueStart = t.repeat = null; editingId = null; save(); render(); };
      box.appendChild(rm);
    }
    box.appendChild(cancelBtn);
    return box;
  }

  // ===== Пункты и заметка =====
  function buildDetails(t) {
    const box = el('div', 'details'); t.subs = t.subs || [];
    t.subs.forEach(s => {
      const row = el('div', 'sub' + (s.done ? ' done' : '')), c = el('button', 'sub-check'), x = el('button', 'sub-del', '×');
      c.type = x.type = 'button'; c.setAttribute('aria-label', 'Отметить пункт'); x.setAttribute('aria-label', 'Удалить пункт');
      c.onclick = () => { s.done = !s.done; save(); render(); };
      x.onclick = () => { t.subs = t.subs.filter(y => y !== s); save(); render(); };
      row.append(c, el('span', 'sub-text', s.text), x); box.appendChild(row);
    });
    const add = el('input', 'field sub-input'); add.placeholder = 'Новый пункт (Enter)'; add.maxLength = 100;
    add.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || !add.value.trim()) return;
      t.subs.push({ id: Date.now(), text: add.value.trim(), done: false }); save(); render();
      const i = $('list').querySelector('.task[data-id="' + t.id + '"] .sub-input'); if (i) i.focus();
    });
    const note = el('textarea', 'field'), links = el('div', 'links');
    note.placeholder = 'Заметка или ссылка'; note.rows = 3; note.maxLength = 1000; note.value = t.note || '';
    const fillLinks = () => {
      links.innerHTML = '';
      (note.value.match(/https?:\/\/[^\s]+/g) || []).forEach(u => { const a = el('a', '', u); a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer'; links.appendChild(a); });
    };
    let nt; fillLinks();
    note.addEventListener('input', () => { t.note = note.value; clearTimeout(nt); nt = setTimeout(save, 500); });
    note.addEventListener('blur', () => { clearTimeout(nt); t.note = note.value; save(); fillLinks(); });
    box.append(add, note, links);
    return box;
  }

  // ===== Одна задача =====
  function iconBtn(cls, html, title, fn) {
    const b = el('button', 'icon-btn ' + cls); b.type = 'button'; b.innerHTML = html; b.title = title; b.setAttribute('aria-label', title); b.onclick = fn; return b;
  }
  function buildTask(t) {
    const li = el('li', 'task' + (t.done ? ' done' : '') + (t.prio ? ' p-' + t.prio : '')); li.dataset.id = t.id;
    const grip = el('span', 'grip'); grip.innerHTML = GRIP; grip.title = 'Перетащить';
    const check = el('button', 'check'); check.type = 'button';
    check.setAttribute('aria-label', t.done ? 'Вернуть в активные' : 'Отметить выполненной'); check.onclick = () => toggleTask(t.id);

    const parsed = parse(t.text), body = el('div', 'task-body');
    const span = el('span', 'task-text', parsed.title); span.title = 'Двойной клик — изменить текст';
    span.addEventListener('dblclick', () => {              // правка текста на месте
      const inp = el('input', 'edit-input'); inp.value = t.text; inp.maxLength = 120; let fin = false;
      const finish = apply => { if (fin) return; fin = true; const v = inp.value.trim(); if (apply && v) { t.text = v; save(); } render(); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
      inp.addEventListener('blur', () => finish(true));
      span.replaceWith(inp); inp.focus(); inp.select();
    });
    body.appendChild(span);

    const chips = el('div', 'chips');
    if (t.prio) chips.appendChild(el('span', 'chip ' + (t.prio === 'high' ? 'hi' : 'lo'), PRIO_NAME[t.prio]));
    parsed.tags.forEach(x => chips.appendChild(el('span', 'chip', '#' + x)));
    if (t.subs && t.subs.length) chips.appendChild(el('span', 'chip', 'пункты ' + t.subs.filter(s => s.done).length + ' из ' + t.subs.length));
    if (t.note) chips.appendChild(el('span', 'chip', 'есть заметка'));
    if (chips.children.length) body.appendChild(chips);
    if (t.due) body.appendChild(buildDue(t));
    if (t.id === editingId) body.appendChild(buildEditor(t));
    if (t.id === openId) body.appendChild(buildDetails(t));

    const actions = el('div', 'task-actions');
    const pName = t.prio === 'high' ? 'важно' : t.prio === 'low' ? 'потом' : 'обычная';
    actions.appendChild(iconBtn(t.prio === 'high' ? 'hi' : t.prio === 'low' ? 'lo' : '', FLAG, 'Приоритет: ' + pName + ' (нажмите, чтобы сменить)', () => {
      const order = [null, 'high', 'low']; t.prio = order[(order.indexOf(t.prio || null) + 1) % 3]; save(); render();
    }));
    actions.appendChild(iconBtn((t.subs && t.subs.length) || t.note ? 'on' : '', LIST, 'Пункты и заметка', () => {
      openId = openId === t.id ? null : t.id; render();
    }));
    if (!t.done) {
      actions.appendChild(iconBtn(t.due ? 'on' : '', CLOCK, 'Срок', () => {
        editingId = editingId === t.id ? null : t.id; render();
        const i = $('list').querySelector('.due-editor input'); if (i) i.focus();
      }));
    }
    const del = el('button', 'del', '×'); del.type = 'button'; del.setAttribute('aria-label', 'Удалить задачу'); del.onclick = () => removeTasks([t]);
    actions.appendChild(del);
    li.append(grip, check, body, actions);
    return li;
  }

  // ===== Статистика =====
  function renderStats() {
    const counts = {}; log.forEach(x => { const k = dayKey(x.at); counts[k] = (counts[k] || 0) + 1; });
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      days.push({ n: counts[dayKey(d.getTime())] || 0, label: d.toLocaleDateString('ru-RU', { weekday: 'short' }) });
    }
    const max = Math.max(1, ...days.map(d => d.n));
    $('stWeek').textContent = days.reduce((s, d) => s + d.n, 0);
    let streak = 0, i = counts[dayKey(Date.now())] ? 0 : 1;         // серия не обрывается, пока день не закончился
    for (;; i++) { const d = new Date(); d.setDate(d.getDate() - i); if (!counts[dayKey(d.getTime())]) break; streak++; }
    $('stStreak').textContent = streak;
    const bars = $('stBars'); bars.innerHTML = '';
    days.forEach(d => {
      const col = el('div', 'col' + (d.n ? '' : ' zero')), bar = document.createElement('i');
      bar.style.height = Math.max(3, d.n / max * 44) + 'px';
      col.append(bar, el('span', '', d.label)); col.title = d.n; bars.appendChild(col);
    });
  }

  // ===== Отрисовка =====
  function render() {
    const tagList = [...new Set(tasks.flatMap(t => parse(t.text).tags))].sort();
    if (activeTag && !tagList.includes(activeTag)) activeTag = null;
    const tagsEl = $('tags'); tagsEl.innerHTML = '';
    tagList.forEach(tag => {
      const b = el('button', 'tag' + (tag === activeTag ? ' on' : ''), '#' + tag); b.type = 'button';
      b.onclick = () => { activeTag = activeTag === tag ? null : tag; render(); }; tagsEl.appendChild(b);
    });
    lastOverdue = tasks.filter(isOverdue).length;
    const visible = sorted(tasks.filter(shown)), listEl = $('list');
    listEl.classList.toggle('locked', sort !== 'manual');
    if (sortable) sortable.option('disabled', sort !== 'manual');
    listEl.innerHTML = '';
    if (!visible.length) listEl.appendChild(el('li', 'empty', tasks.length ? 'Здесь пока пусто.' : 'Список пуст. Добавьте первую задачу.'));
    visible.forEach(t => listEl.appendChild(buildTask(t)));
    const done = tasks.filter(t => t.done).length;
    $('doneCount').textContent = pad(done); $('totalCount').textContent = pad(tasks.length);
    $('barFill').style.width = (tasks.length ? done / tasks.length * 100 : 0) + '%';
    renderStats();
  }
  function tick() {                                        // каждую секунду: шкалы, напоминания, перенос в «просроченные»
    checkReminders();
    document.querySelectorAll('.task[data-id]').forEach(li => {
      const t = tasks.find(x => x.id === Number(li.dataset.id)), box = li.querySelector('.due');
      if (t && t.due && !t.done && box) paintTimer(box, t);
    });
    if (busy()) return;
    if (tasks.filter(isOverdue).length !== lastOverdue) render();
  }

  // ===== Перетаскивание (только в «моём» порядке) =====
  let sortable = null;
  if (window.Sortable) {
    sortable = new Sortable($('list'), {
      handle: '.grip', animation: 150, ghostClass: 'sortable-ghost', filter: '.empty',
      onEnd: () => {
        const ids = [...$('list').querySelectorAll('.task[data-id]')].map(li => Number(li.dataset.id));
        const slots = []; tasks.forEach((t, i) => { if (ids.includes(t.id)) slots.push(i); });
        const byId = new Map(tasks.map(t => [t.id, t]));
        slots.forEach((slot, k) => { tasks[slot] = byId.get(ids[k]); });
        save();
      }
    });
  }

  // ===== Форма, разделы, поиск, порядок =====
  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('taskInput').value.trim(); if (!text) return;
    tasks.push({ id: Date.now(), text: text, done: false, due: null }); save(); render();
    $('taskInput').value = ''; $('taskInput').focus();
  });
  $('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter'); if (!btn) return;
    filter = btn.dataset.filter; showConfirm(false);
    document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b === btn)); render();
  });
  $('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); showConfirm(false); render(); });
  $('sort').value = sort;
  $('sort').addEventListener('change', e => { sort = e.target.value; try { localStorage.setItem(SORT_KEY, sort); } catch (x) {} render(); });

  // ===== «Убрать задачи»: вопрос «Да / Нет» на 3 секунды =====
  let confirmTimer;
  function showConfirm(show) {
    clearTimeout(confirmTimer); $('confirmBox').hidden = !show; $('clearAll').hidden = show;
    if (show) confirmTimer = setTimeout(() => showConfirm(false), 3000);
  }
  $('clearAll').onclick = () => { if (tasks.some(shown)) showConfirm(true); };
  $('confirmNo').onclick = () => showConfirm(false);
  $('confirmYes').onclick = () => { showConfirm(false); removeTasks(tasks.filter(shown)); };

  // ===== Горячие клавиши (по коду клавиши, работают в любой раскладке) =====
  document.addEventListener('keydown', e => {
    const tg = (e.target.tagName || '').toLowerCase(), typing = tg === 'input' || tg === 'textarea' || tg === 'select';
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !typing) { if (undoFn) { e.preventDefault(); undoFn(); } return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Slash') { e.preventDefault(); $('search').focus(); }
    else if (e.code === 'KeyN') { e.preventDefault(); $('taskInput').focus(); }
  });

  render();
  setInterval(tick, 1000);
</script>
</body>
</html>
